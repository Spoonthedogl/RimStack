[package]
name = "rimstack-core"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
# Read-only XML tree for files written by strangers (MIT/Apache-2.0).
roxmltree = "0.21"
# The patch simulation's document and XPath: libxml2's XPath is 1.0, as
# .NET's is, and the one engine fast enough on a whole mod list (MIT).
libxml = "0.3"
# Scan mod folders on all cores (MIT/Apache-2.0).
rayon = "1"
# Community rule files are JSON (MIT/Apache-2.0).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# HTTPS downloads of community data, on request only (MIT/Apache-2.0).
ureq = "3"
# Decode PNG textures (MIT/Apache-2.0).
image = { version = "0.25", default-features = false, features = ["png"] }
# Encode DDS textures: BC1/BC7 and mipmaps (MIT).
image_dds = "0.7.2"
# Read gzip files (already used by the PNG decoder) (MIT/Apache-2.0).
flate2 = "1"
# Read saves a mod wrote compressed with zstd; decoding only, in Rust (MIT).
ruzstd = "0.9"
libloading = "0.9"
# Which form a count takes in each language, from CLDR (Unicode-3.0). The
# ICU4X family is already built for `ureq`'s URL handling.
icu_plurals = "2.3"
icu_locale_core = "2.3"
# Rules shared between threads.
icu_provider = { version = "2.3", features = ["sync"] }
# Whether the game runs, on each system: Windows and macOS have no /proc (MIT).
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
# Canonical paths without Windows' \\?\ prefix, which the game and the
# interface do not expect (CC0-1.0/MIT-0/Apache-2.0).
dunce = "1"
# Dates in the diagnostics; already built for the app (MIT/Apache-2.0).
chrono = { version = "0.4", default-features = false, features = ["alloc"] }

[dev-dependencies]
tempfile = "3"
